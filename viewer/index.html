<title>Architecture Diagrams</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one working surface. Diagram picker and meta on top, a white drawing board (the house
   diagram style is light-only), then the registry rows for the integrations the diagram shows. */
:root {
  --bg: #F3F6F8;
  --surface: #FFFFFF;
  --fg: #1C2A35;
  --muted: #586874;
  --line: #D3DCE3;
  --accent: #1F6FA8;
  --accent-ink: #FFFFFF;
  --sel: #FFF4CC;
  --planned: #C2410C;
  --ok: #3C8D6B;
  --err: #B42318;
  --err-bg: #FEF3F2;
  --board: #FFFFFF;
  --board-line: #D3DCE3;
  --font: "IBM Plex Sans", Arial, Helvetica, sans-serif;
  --heading: var(--font);
  --tbc: #FFF0A8;
  --tbc-ink: #5C4A00;
  --tbc-line: #C07A1A;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1820; --surface: #16222C; --fg: #E4EBF0; --muted: #9AABB8; --line: #2A3B48;
    --accent: #5AA6DC; --accent-ink: #0F1820; --sel: #3A3416; --planned: #F08A5D; --ok: #6CC3A0;
    --err: #FDA29B; --err-bg: #3A1A17; --board: #FFFFFF; --board-line: #2A3B48; color-scheme: dark;
    --tbc: #5A4C12; --tbc-ink: #FFE89A; --tbc-line: #E2A04A;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1820; --surface: #16222C; --fg: #E4EBF0; --muted: #9AABB8; --line: #2A3B48;
  --accent: #5AA6DC; --accent-ink: #0F1820; --sel: #3A3416; --planned: #F08A5D; --ok: #6CC3A0;
  --err: #FDA29B; --err-bg: #3A1A17; --board: #FFFFFF; --board-line: #2A3B48; color-scheme: dark;
  --tbc: #5A4C12; --tbc-ink: #FFE89A; --tbc-line: #E2A04A;
}
html, body { background: var(--bg); color: var(--fg); }
body {
  font: 15px/1.5 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
.wrap { max-width: 1680px; margin: 0 auto; display: grid; gap: 10px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; min-width: 0; }
h1 { margin: 0; font: 600 1.35rem/1.25 var(--heading); text-wrap: balance; }
.project { font-size: .85rem; color: var(--muted); }
.head-tag { font: 500 .78rem var(--mono); color: var(--muted); white-space: nowrap; }
.head-tag b { color: var(--fg); font-weight: 600; }
.head-right { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; min-width: 0; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); font-family: var(--mono); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.live.on i { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.live.flash i { background: var(--accent); }

select {
  font: 500 .9rem var(--font); color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; min-height: 34px; max-width: 100%;
}
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .82rem; color: var(--muted); }
.meta b { color: var(--fg); font-weight: 500; }
.meta .mono { font-family: var(--mono); }
/* Above the diagram: the first sentence of the description only, over the full width. */
.question { margin: 0; color: var(--fg); }
.about { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; display: grid; gap: 6px; }
.about h2 { margin: 0; }
.about p { margin: 0; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.group-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 2px; }
button {
  font: 500 .85rem var(--font); color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer; min-height: 32px;
}
button:hover { border-color: var(--accent); }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, select:focus-visible, tr:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.zoom-level { font-family: var(--mono); font-size: .8rem; color: var(--muted); min-width: 4.5ch; text-align: right; font-variant-numeric: tabular-nums; }

.board {
  position: relative; min-width: 0; background: var(--board); border: 1px solid var(--board-line); border-radius: 8px;
  height: clamp(420px, 74vh, 900px); overflow: hidden; touch-action: none; cursor: grab;
}
.board.dragging { cursor: grabbing; }
.stage, .stage > svg { width: 100%; height: 100%; display: block; }
.stage > svg { user-select: none; -webkit-user-select: none; max-width: none !important; }
.hint {
  position: absolute; left: 12px; bottom: 10px; font-size: .76rem; color: #4B5B68;
  background: rgba(255,255,255,.92); border: 1px solid #D3DCE3; border-radius: 4px; padding: 3px 8px; pointer-events: none;
}
.empty { position: absolute; inset: 0; display: grid; place-items: center; color: #4B5B68; font-size: .95rem; padding: 24px; text-align: center; }
.error {
  position: absolute; top: 10px; right: 10px; left: 10px; max-height: 45%; overflow: auto;
  background: var(--err-bg); color: var(--err); border: 1px solid var(--err); border-radius: 6px;
  font: .8rem/1.45 var(--mono); padding: 10px 12px; white-space: pre-wrap;
}

/* Diagram items: every link, message, transition, box and participant has the class "it". */
.stage svg .it { cursor: pointer; transition: opacity .15s; }
.stage svg .cluster { transition: opacity .15s; }
.stage svg.has-sel .it:not(.sel) { opacity: .14; }
.stage svg.has-sel .cluster { opacity: .4; }
.stage svg .it.off { opacity: .1; }
.stage svg .it.soft { opacity: .45; }
.stage svg path.it.sel, .stage svg line.it.sel { stroke-width: 3.5px !important; }
.stage svg text.it.sel { font-weight: 700 !important; }
.stage svg g.it.sel:not(.edgeLabel) { filter: drop-shadow(0 0 3px var(--accent)); }
.stage svg .edgeLabel.sel .labelBkg, .stage svg .edgeLabel.sel foreignObject div { background: #CFE3F5 !important; }
.stage svg .hov { filter: drop-shadow(0 0 2px #F59E0B) drop-shadow(0 0 5px #F59E0B) !important; opacity: 1 !important; }
/* Mermaid's own notes are neutral grey (the kit sets them so); yellow means "to confirm" only. */

/* Full screen: the toolbar, the board, the notes and the key fill the screen. The Fullscreen API is
   used when the page may use it; else (in some frames) the same layout covers the window. */
.viewer { display: grid; gap: 14px; min-width: 0; }
.fs-title { display: none; font: 600 1rem/1.3 var(--heading); margin-right: auto; }
.viewer:fullscreen, .viewer.fs {
  position: fixed; inset: 0; z-index: 1000; background: var(--bg); overflow: auto;
  padding: 10px max(16px, env(safe-area-inset-left, 0px)) 12px; gap: 10px;
  grid-template-rows: auto minmax(0, 1fr) auto;
}
.viewer:fullscreen .fs-title, .viewer.fs .fs-title { display: block; }
.viewer:fullscreen .work, .viewer.fs .work { min-height: 0; }
.viewer:fullscreen .board, .viewer.fs .board { height: auto; min-height: 240px; }
.viewer:fullscreen .rail, .viewer.fs .rail { max-height: none; min-height: 0; }
@media (max-width: 1000px) {
  .viewer:fullscreen .work.has-notes, .viewer.fs .work.has-notes { grid-template-rows: minmax(0, 1fr) minmax(0, 38%); }
}
body.fs-open { overflow: hidden; }
#fs svg { vertical-align: -2px; margin-right: 4px; }

/* The key under the diagram. It sits on the white of the board, as the colours are for white. */
.legend {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; font-size: .8rem; color: #4B5B68;
  background: var(--board); border: 1px solid var(--board-line); border-radius: 8px; padding: 8px 12px;
}
.lg-head { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: #4B5B68; }
.lg-group { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
.lg-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: #1C2A35; }
.lg-item small { color: #4B5B68; font-size: .74rem; }
.lg-word { font: 600 .72rem var(--mono); letter-spacing: .02em; }
.lg-sw { display: inline-block; width: 22px; height: 13px; border-radius: 3px; border: 1px solid; }
.lg-badge {
  display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 4px; box-sizing: border-box;
  border-radius: 999px; background: var(--accent); color: var(--accent-ink); font: 700 10px Arial, Helvetica, sans-serif;
}
.lg-codes { flex: 1 1 320px; display: inline-flex; align-items: center; gap: 8px; color: #1C2A35; white-space: normal; }
.lg-codes a { color: inherit; }

h2 { margin: 6px 0 0; font: 600 1rem/1.3 var(--heading); }

/* The board and the notes rail sit side by side on wide screens, one above the other on narrow ones. */
.work { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.work.has-notes { grid-template-columns: minmax(0, 1fr) minmax(280px, 340px); }
@media (max-width: 1000px) { .work.has-notes { grid-template-columns: minmax(0, 1fr); } }
.rail {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px;
  display: flex; flex-direction: column; gap: 10px; min-height: 0; max-height: clamp(420px, 74vh, 900px);
}
@media (max-width: 1000px) { .rail { max-height: none; } }
.rail-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.rail-head h2 { margin: 0; }
.rail-count { font-size: .78rem; color: var(--muted); font-family: var(--mono); }
.rail input[type="search"] {
  font: .88rem var(--font); color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; min-height: 34px; width: 100%; box-sizing: border-box;
}
.rail label.check { display: flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); cursor: pointer; }
.notes { min-height: 0; flex: 1 1 auto; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-right: 2px; }
.note {
  border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 7px;
  padding: 8px 10px; font-size: .85rem; line-height: 1.45; cursor: pointer; background: var(--surface);
}
.note:hover { border-color: var(--accent); }
.note.sel { box-shadow: 0 0 0 2px var(--accent); }
.note.rel { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent); }
.note.hov { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.note.tbc.hov { background: color-mix(in srgb, var(--tbc-line) 18%, var(--tbc)); }
.note.tbc { background: var(--tbc); color: var(--tbc-ink); border-left-color: var(--tbc-line); }
.note .code {
  display: inline-block; min-width: 1.6em; text-align: center; font: 600 .72rem var(--mono); padding: 1px 6px; margin-right: 6px;
  border-radius: 999px; background: var(--accent); color: var(--accent-ink); vertical-align: 1px;
}
.note.tbc .code { background: var(--tbc-line); color: #FFFFFF; }
.note .flag { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; margin-left: 4px; }
.note a { color: inherit; }
.note code { font-family: var(--mono); font-size: .85em; }
.notes-empty { font-size: .85rem; color: var(--muted); }
.stage svg .badge { cursor: pointer; }
.stage svg .badge circle { fill: var(--accent); stroke: #FFFFFF; stroke-width: 2px; }
.stage svg .badge.tbc circle { fill: #C07A1A; }
.stage svg .badge text { fill: #FFFFFF; font: 700 10px Arial, Helvetica, sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.stage svg.has-sel .badge:not(.sel) { opacity: .3; }
.stage svg .badge.hov circle { stroke: #F59E0B; stroke-width: 3px; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; min-width: 860px; font-size: .85rem; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; background: var(--surface); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
tbody tr.sel { background: var(--sel); }
tbody tr:last-child td { border-bottom: 0; }
td:first-child { font-family: var(--mono); white-space: nowrap; }
td a { color: var(--accent); }
td code, .foot code { font-family: var(--mono); font-size: .85em; }
.chip { display: inline-block; font-family: var(--mono); font-size: .7rem; letter-spacing: .04em; padding: 2px 7px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--muted); color: var(--muted); }
.chip.g-done { color: var(--accent); border-color: var(--accent); }
.chip.g-planned { color: var(--planned); border-color: var(--planned); border-style: dashed; }
.chip.g-open { color: var(--planned); border-color: var(--planned); border-style: dotted; }
.chip.struck { text-decoration: line-through; }
.foot { font-size: .8rem; color: var(--muted); margin: 0; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .stage svg * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <h1 id="title">Architecture Diagrams</h1>
      <span class="head-tag" id="head-tag"></span>
      <span class="project" id="project"></span>
    </div>
    <div class="head-right">
      <select id="diagram" aria-label="Diagram"></select>
      <span class="live" id="live" hidden><i></i><span id="live-text">Live · reloads on save</span></span>
    </div>
  </header>
  <p class="question" id="question" hidden></p>

  <section class="viewer" id="viewer" aria-label="Diagram">
    <div class="toolbar">
      <span class="fs-title" id="fs-title"></span>
      <div class="group" role="group" aria-label="Show items by status" id="filters" hidden>
        <span class="group-label">Show</span>
        <span class="group" id="filter-btns"></span>
      </div>
      <div class="group" role="group" aria-label="Zoom">
        <button id="z-out" aria-label="Zoom out">−</button>
        <span class="zoom-level" id="z-level">100%</span>
        <button id="z-in" aria-label="Zoom in">+</button>
        <button id="z-fit">Fit</button>
        <button id="fs" aria-pressed="false" title="Full screen (Esc to leave)">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14"><path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          <span id="fs-text">Full screen</span>
        </button>
      </div>
    </div>

    <div class="work" id="work">
      <div class="board" id="board">
        <div class="stage" id="stage"></div>
        <div class="empty" id="empty">Loading diagrams…</div>
        <div class="error" id="error" role="alert" hidden></div>
        <div class="hint">Drag to pan · scroll or pinch to zoom · click a label, a box or a circled code</div>
      </div>
      <aside class="rail" id="rail" hidden aria-label="Notes">
        <div class="rail-head"><h2>Notes</h2><span class="rail-count" id="note-count"></span></div>
        <input type="search" id="note-search" placeholder="Search the notes" aria-label="Search the notes">
        <label class="check" id="tbc-wrap"><input type="checkbox" id="note-tbc"> To confirm only</label>
        <div class="notes" id="notes"></div>
      </aside>
    </div>

    <div class="legend" id="legend" aria-label="Key" hidden></div>
  </section>

  <section class="about" id="about" aria-labelledby="about-h">
    <h2 id="about-h">About this diagram</h2>
    <p id="about-text" hidden></p>
    <div class="meta" id="meta"></div>
  </section>

  <section id="registry" hidden>
    <h2>Integrations in this diagram</h2>
    <div class="table-wrap">
      <table>
        <thead><tr id="reg-head"></tr></thead>
        <tbody id="reg-rows"></tbody>
      </table>
    </div>
  </section>
  <p class="foot" id="foot"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js"></script>
<script>
(function () {
  'use strict';
  // ---------- Statuses: lib/status.mjs, put in here by `serve` and `build` ----------
  /* @status-lib */

  const $ = (id) => document.getElementById(id);
  const board = $('board'), stage = $('stage'), errorEl = $('error'), emptyEl = $('empty');
  const select = $('diagram'), viewerEl = $('viewer');
  let manifest = null, current = null, renderSeq = 0, queue = Promise.resolve();
  let svg = null, base = null, vb = null, selected = null, filter = 'all';
  // What the drawing holds: every item, the boxes and participants by ID, the items of each I-xx.
  let items = [], nodes = {}, byInt = {}, itemOf = new WeakMap(), kind = 'other';

  function initMermaid() {
    mermaid.initialize({
      startOnLoad: false, securityLevel: 'strict',
      themeVariables: Object.fromEntries(Object.entries(NOTE_THEME).map(([k, v]) => [k, tint(v)])),
    });
  }

  // ---------- Loading ----------
  async function getText(url) {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(url + ': HTTP ' + r.status);
    return r.text();
  }
  async function loadManifest() {
    manifest = JSON.parse(await getText('manifest.json'));
    applyTheme(manifest.theme);
    $('project').textContent = manifest.project || '';
    const keep = select.value;
    select.innerHTML = '';
    manifest.diagrams.forEach((d) => {
      const o = document.createElement('option');
      o.value = d.slug;
      o.textContent = (d.id ? d.id + ' · ' : '') + (d.title || d.file);
      select.appendChild(o);
    });
    if (keep) select.value = keep;
    const src = manifest.source || {};
    $('foot').innerHTML = 'Source: <code>' + esc(src.dir || '') + '</code>' +
      (src.project ? ' and <code>' + esc(src.project) + '</code>' : '') +
      '. The repo is correct where this page does not agree with it.';
    if (!manifest.diagrams.length) emptyEl.textContent = 'No .mmd files in ' + (src.dir || 'the diagram folder') + '.';
  }
  function slugFromHash() { return decodeURIComponent(location.hash.replace(/^#/, '')).toLowerCase(); }
  const find = () => manifest.diagrams.find((d) => d.slug === slugFromHash());
  function pick() { return find() || manifest.diagrams[0]; }
  // A link to a diagram added after the page loaded: read the list again before falling back.
  async function pickFresh() {
    if (!find() && slugFromHash()) await loadManifest();
    return pick();
  }

  // ---------- Theme ----------
  let themeKey = null;
  function applyTheme(theme) {
    const key = JSON.stringify(theme || null);
    if (key === themeKey) return;
    themeKey = key;
    document.getElementById('theme-style')?.remove();
    document.getElementById('theme-fonts')?.remove();
    document.getElementById('status-style')?.remove();
    // The status colours, through the theme's colour map. In <head>, so the theme can still win.
    const st = document.createElement('style');
    st.id = 'status-style';
    st.textContent = statusCss('.stage svg', tint);
    document.head.appendChild(st);
    initMermaid();
    if (!theme) return;
    const fonts = theme.fonts || {};
    if (fonts.stylesheet && /^https:\/\/fonts\.googleapis\.com\//.test(fonts.stylesheet)) {
      const link = document.createElement('link');
      link.id = 'theme-fonts'; link.rel = 'stylesheet'; link.href = fonts.stylesheet;
      document.head.appendChild(link);
    }
    const decl = (vars) => Object.entries(vars || {})
      .filter(([k, v]) => /^--[a-z-]+$/.test(k) && /^[^;{}<>]*$/.test(String(v)))
      .map(([k, v]) => k + ':' + v + ';').join('');
    const base = decl(Object.assign({}, theme.light,
      fonts.body ? { '--font': fonts.body } : {}, fonts.heading ? { '--heading': fonts.heading } : {}));
    const dark = decl(theme.dark);
    const style = document.createElement('style');
    style.id = 'theme-style';
    style.textContent = ':root{' + base + '}' + (dark
      ? '@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){' + dark + '}}:root[data-theme="dark"]{' + dark + '}'
      : '');
    // After the viewer's own style, so the theme's values win.
    document.body.appendChild(style);
  }
  function recolorMap() {
    const map = manifest && manifest.theme && manifest.theme.recolor;
    if (!map) return null;
    const lookup = {};
    Object.keys(map).forEach((k) => { lookup[k.toLowerCase()] = map[k]; });
    return lookup;
  }
  function themed(text) {
    const lookup = recolorMap();
    return lookup ? text.replace(/#[0-9a-f]{6}\b/gi, (c) => lookup[c.toLowerCase()] || c) : text;
  }
  function tint(c) { const lookup = recolorMap(); return (lookup && lookup[c.toLowerCase()]) || c; }

  // Renders run one at a time, and only the latest request reaches the screen, so the drawing and
  // its title always belong to the same diagram.
  function show(d, keepView) {
    if (!d) return Promise.resolve();
    const seq = ++renderSeq;
    select.value = d.slug;
    queue = queue.then(() => render(d, seq, keepView)).catch((e) => showError(e.message || String(e)));
    return queue;
  }
  async function render(d, seq, keepView) {
    if (seq !== renderSeq) return;

  function analyse(d) {

  // Path ids look like "L_<from>_<to>_<n>"; node ids may hold "_", so match them against the node list.

    relateNotes([it.id, ...it.ints].filter(Boolean), scroll);
  }

  // ---------- Notes: the rail, and a numbered circle on the first item each note names ----------
  const notesOf = () => (current && current.callouts) || [];
  function targetsOf(note) {
    return note.targets.flatMap((t) => (nodes[t] ? nodes[t].els : byInt[t] ? byInt[t].flatMap((it) => it.els) : []));
  }
  /** The parts to zoom to: a participant's top box, not its lifeline. */
  function focusOf(note) {
    return note.targets.flatMap((t) => (nodes[t] ? nodes[t].focus || nodes[t].els : byInt[t] ? byInt[t].flatMap((it) => it.els) : []));
  }
  function renderNotes() {
    const list = svg ? notesOf() : [];
    $('rail').hidden = !list.length;
    $('work').classList.toggle('has-notes', list.length > 0);
    const hasTbc = list.some((n) => n.toConfirm);
    $('tbc-wrap').hidden = !hasTbc;
    // A hidden filter must not stay on, or a diagram with no points to confirm shows no notes.
    if (!hasTbc) $('note-tbc').checked = false;
    $('notes').innerHTML = list.map((n) =>
      '<div class="note' + (n.toConfirm ? ' tbc' : '') + '" tabindex="0" data-code="' + esc(n.code) + '">' +
      '<span class="code">' + esc(n.code) + '</span>' + n.html +
      (n.toConfirm ? ' <span class="flag">To confirm</span>' : '') + '</div>').join('');
    filterNotes();
    if (!svg) return;
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'badges');
    svg.appendChild(g);
    const stack = new Map();
    list.forEach((n) => {
      const el = targetsOf(n)[0];
      if (!el) return;
      const r = el.getBoundingClientRect(), p = toSvg(r.right, r.top);
      const k = stack.get(el) || 0;
      stack.set(el, k + 1);
      const b = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      b.setAttribute('class', 'badge' + (n.toConfirm ? ' tbc' : ''));
      b.dataset.code = n.code;
      const rad = n.code.length > 2 ? 13 : 11;
      b.setAttribute('transform', 'translate(' + (p.x - k * (rad * 2 + 3)) + ',' + p.y + ')');
      b.innerHTML = '<title></title><circle r="' + rad + '"></circle><text></text>';
      b.querySelector('title').textContent = n.code + ': ' + n.text;
      b.querySelector('text').textContent = n.code.length > 4 ? n.code.slice(0, 4) : n.code;
      g.appendChild(b);
    });
  }
  function filterNotes() {
    const q = $('note-search').value.trim().toLowerCase(), only = $('note-tbc').checked;
    const list = notesOf();
    let shown = 0;
    document.querySelectorAll('#notes .note').forEach((el, i) => {
      const n = list[i];
      const ok = n && (!only || n.toConfirm) && (!q || (n.code + ' ' + n.text).toLowerCase().includes(q));
      el.hidden = !ok;
      if (ok) shown++;
    });
    $('note-count').textContent = shown === list.length ? String(list.length) : shown + ' of ' + list.length;
  }
  function selectNote(code, zoom) {
    const n = notesOf().find((x) => x.code === code);
    if (!n) return null;
    clearSel();
    selected = { type: 'note', key: code };
    const card = cardOf(code);
    if (card) card.classList.add('sel');
    const els = targetsOf(n);
    if (svg) {
      svg.classList.add('has-sel');
      els.forEach((el) => el.classList.add('sel'));
      svg.querySelectorAll('.badge[data-code="' + CSS.escape(code) + '"]').forEach((b) => b.classList.add('sel'));
      if (zoom && els.length) zoomTo(focusOf(n));
    }
    return card;
  }
  // Hover: a circle shows its note; a note shows its items.
  function hoverNote(code, on) {
    const card = cardOf(code);
    if (card) card.classList.toggle('hov', on);
    if (!svg) return;
    svg.querySelectorAll('.badge[data-code="' + CSS.escape(code) + '"]').forEach((b) => b.classList.toggle('hov', on));
    const n = notesOf().find((x) => x.code === code);
    if (n) targetsOf(n).forEach((el) => el.classList.toggle('hov', on));
  }
  $('note-search').addEventListener('input', filterNotes);
  $('note-tbc').addEventListener('change', filterNotes);
  $('notes').addEventListener('click', (e) => {
    if (e.target.closest('a')) return;
    const card = e.target.closest('.note');
    if (!card) return;
    if (selected && selected.type === 'note' && selected.key === card.dataset.code) { clearSel(); return; }
    selectNote(card.dataset.code, true);
  });
  $('notes').addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.note')) { e.preventDefault(); e.target.click(); }
  });
  let hovered = null;
  const setHover = (code) => {
    if (hovered === code) return;
    if (hovered) hoverNote(hovered, false);
    hovered = code;
    if (code) hoverNote(code, true);
  };
  $('notes').addEventListener('mouseover', (e) => { const c = e.target.closest('.note'); setHover(c ? c.dataset.code : null); });
  $('notes').addEventListener('mouseleave', () => setHover(null));
  stage.addEventListener('mouseover', (e) => {
    const b = e.target.closest('.badge');
    if (b) { setHover(b.dataset.code); const card = cardOf(b.dataset.code); if (card && !card.hidden) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
    else setHover(null);
  });
  stage.addEventListener('mouseleave', () => setHover(null));

  function itemAt(target) {
    for (let n = target; n && n !== stage; n = n.parentNode) if (itemOf.has(n)) return itemOf.get(n);
    return null;
  }
  stage.addEventListener('click', (e) => {
    if (moved > 6) return;
    const badge = e.target.closest('.badge');
    if (badge) {
      if (selected && selected.type === 'note' && selected.key === badge.dataset.code) return clearSel();
      selectNote(badge.dataset.code, false);
      revealCard(badge.dataset.code);
      return;
    }
    const it = itemAt(e.target);
    if (!it || it.kind === 'mnote' && !it.ints.length) return clearSel();
    if (it.ints.length === 1 && it.kind !== 'node') {
      const id = it.ints[0];
      if (selected && selected.type === 'int' && selected.key === id) return clearSel();
      const row = selectInt(id, false);
      if (row && !document.querySelector('#notes .note.rel')) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      return;
    }
    if (selected && (selected.key === it || (it.id && selected.key === it.id))) return clearSel();
    selectItem(it, true);
  });
  $('reg-rows').addEventListener('click', (e) => {
    if (e.target.closest('a')) return;
    const tr = e.target.closest('tr');
    if (!tr) return;
    if (selected && selected.type === 'int' && selected.key === tr.dataset.id) { clearSel(); return; }
    selectInt(tr.dataset.id, true);
    board.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
  $('reg-rows').addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (viewerEl.classList.contains('fs')) exitFs();
    else clearSel();
  });

  // ---------- The "Show" filter: one status group, for every diagram type ----------
  const ORDER = ['done', 'planned', 'open', 'tbc'];
  const groupOf = (it) => (it.status ? STATUS_GROUPS[it.status] : null);
  function buildFilters() {
    const present = new Set();
    items.forEach((it) => {
      if (it.kind === 'actor') return;
      if (it.status) present.add(groupOf(it));
      if (it.tbc) present.add('tbc');
    });
    if (filter !== 'all' && !present.has(filter)) filter = 'all';
    $('filters').hidden = !present.size;
    $('filter-btns').innerHTML = ['all', ...ORDER.filter((g) => present.has(g))].map((g) =>
      '<button data-filter="' + g + '" aria-pressed="' + (g === filter) + '">' + (g === 'all' ? 'All' : GROUP_NAMES[g]) + '</button>').join('');
  }
  $('filter-btns').addEventListener('click', (e) => {
    const b = e.target.closest('[data-filter]');
    if (!b) return;
    filter = b.dataset.filter;
    applyFilter();
  });
  function matches(it) {
    if (filter === 'all') return true;
    return filter === 'tbc' ? it.tbc : groupOf(it) === filter;
  }
  function applyFilter() {
    document.querySelectorAll('#filter-btns [data-filter]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.filter === filter)));
    const keep = new Set();
    items.forEach((it) => { it.on = matches(it); if (it.on && it.kind !== 'node') (it.ends || []).forEach((n) => keep.add(n)); });
    items.forEach((it) => {
      let off = false, soft = false;
      if (filter !== 'all') {
        if (it.kind === 'actor') off = false;
        else if (it.kind === 'node') off = !it.on && !keep.has(it.id);
        else if (it.kind === 'mnote') { if (it.status || it.tbc) off = !it.on; else soft = true; }
        else off = !it.on;
      }
      it.els.forEach((el) => { el.classList.toggle('off', off); el.classList.toggle('soft', soft); });
    });
    // The table shows the integrations that the filter shows.
    document.querySelectorAll('#reg-rows tr').forEach((t) => {
      t.hidden = filter !== 'all' && !(byInt[t.dataset.id] || []).some((it) => it.on);
    });
    // A note stays selected; an integration or item that the filter hides does not.
    if (selected && selected.type === 'int' && !(byInt[selected.key] || []).some((it) => it.on)) clearSel();
  }

  // ---------- The key under the diagram ----------
  function lineSample(group) {
    const s = GROUP_STYLES[group];
    return '<svg width="34" height="10" aria-hidden="true"><line x1="1" y1="5" x2="33" y2="5" stroke="' + tint(s.color) +
      '" stroke-width="2.5"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : '') + '/></svg>';
  }
  function renderLegend() {
    const parts = [];
    const used = new Set(items.filter((it) => it.status && it.kind !== 'actor').map((it) => it.status));
    const groups = new Set([...used].map((s) => STATUS_GROUPS[s]));
    if (groups.size) {
      parts.push('<span class="lg-group"><span class="lg-head">Status</span>' + ['DONE', 'PLANNED', 'OPEN'].filter((s) => groups.has(STATUS_GROUPS[s])).map((s) =>
        '<span class="lg-item" title="' + esc(STATUS_NAMES[s] + ': ' + STATUS_MEANINGS[s]) + '">' + lineSample(STATUS_GROUPS[s]) +
        '<b>' + esc(STATUS_NAMES[s]) + '</b><small>' + esc(STATUS_MEANINGS[s]) + '</small></span>').join('') + '</span>');
    }
    const marks = [];
    const tbcUsed = items.some((it) => it.tbc) || notesOf().some((n) => n.toConfirm);
    if (tbcUsed) {
      marks.push('<span class="lg-item"><span class="lg-sw" style="background:' + tint(TBC_STYLE.fill) + ';border-color:' + tint(TBC_STYLE.stroke) +
        '"></span><span><b>Yellow</b> = to confirm: not decided yet. Its note says what is open and who decides.</span></span>');
    }
    const struck = STRUCK.filter((x) => used.has(x));
    if (struck.length) {
      marks.push('<span class="lg-item"><s>Struck through</s><span>= ' + struck.map((x) => esc(STATUS_NAMES[x].toLowerCase() + ' (' + STATUS_MEANINGS[x].split(': ')[1] + ')')).join('; ') + '</span></span>');
    }
    if (items.some((it) => it.kind === 'mnote' && !it.tbc)) {
      marks.push('<span class="lg-item"><span class="lg-sw" style="background:' + tint(NOTE_THEME.noteBkgColor) + ';border-color:' + tint(NOTE_THEME.noteBorderColor) +
        '"></span><span><b>Grey box</b> = a comment in the flow. It is not a status.</span></span>');
    }
    if (marks.length) parts.push('<span class="lg-group"><span class="lg-head">Marks</span>' + marks.join('') + '</span>');
    if (notesOf().length) {
      const text = (current && current.noteCodesHtml) || manifest.noteCodes ||
        'A circled code is the code of a note in the Notes list. Click the code, or the item, to read its note.';
      const sample = esc((notesOf()[0] || {}).code || 'G1');
      parts.push('<span class="lg-codes"><span class="lg-badge">' + sample + '</span><span>' + text + '</span></span>');
    }
    $('legend').hidden = !parts.length;
    $('legend').innerHTML = parts.join('');
  }

  // ---------- Navigation and live reload ----------
  select.addEventListener('change', () => { location.hash = select.value; });
  window.addEventListener('hashchange', async () => { if (manifest) show(await pickFresh(), false); });

  function connectLive() {
    const el = $('live');
    el.hidden = false;
    const es = new EventSource('events');
    es.onopen = () => { el.classList.add('on'); $('live-text').textContent = 'Live · reloads on save'; };
    es.onerror = () => { el.classList.remove('on'); $('live-text').textContent = 'Live · reconnecting…'; };
    es.addEventListener('change', async () => {
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 400);
      try {
        await loadManifest();
        // The diagram the link names, else the one on screen (a page opened with no link), else the first.
        const d = find() || (current && manifest.diagrams.find((x) => x.slug === current.slug)) || pick();
        await show(d, true);
      } catch (e) { showError(e.message); }
    });
  }

  (async function start() {
    try {
      await loadManifest();
      await show(await pickFresh(), false);
      if (manifest.live) connectLive();
    } catch (e) {
      emptyEl.hidden = true;
      showError('The viewer could not load its files.\n\n' + (e.message || e));
    }
  })();
})();
</script>
